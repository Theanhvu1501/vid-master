<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:" />
  <title>Đăng nhập - VidMaster</title>
  <style>
    /* Bảng màu và kiểu dáng lấy theo renderer.html của app */
    :root {
      --bg-primary:#0f1419; --bg-secondary:#151b23; --bg-tertiary:#1c2430; --bg-elevated:#252d3a;
      --accent:#fa6e03; --accent-2:#e85d04; --accent-rgb:250,110,3; --gradient:linear-gradient(135deg,#fa6e03 0%,#e85d04 100%);
      --success:#51cf66; --danger:#ff6b6b;
      --text:#e8edf4; --muted:#94a3b8; --dim:#64748b; --border:#2d3748;
      --r-md:8px; --r-lg:12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text); overflow: hidden;
      /* Phủ kín cả cửa sổ: không còn thẻ nổi giữa nền khác màu */
      background: radial-gradient(120% 70% at 50% -10%, rgba(var(--accent-rgb), .16) 0%, rgba(var(--accent-rgb), 0) 60%), var(--bg-primary);
      display: flex; flex-direction: column; -webkit-app-region: drag;
    }
    .topbar { height: 3px; background: var(--gradient); flex: none; }
    main { flex: 1; min-height: 0; width: 100%; max-width: 360px; margin: 0 auto; padding: 28px 24px 18px; display: flex; flex-direction: column; justify-content: center; -webkit-app-region: no-drag; }
    .brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 12px; margin-bottom: 22px; }
    .logo { width: 72px; height: 72px; object-fit: contain; display: block; filter: drop-shadow(0 6px 18px rgba(var(--accent-rgb), .35)); -webkit-user-drag: none; user-select: none; }
    h1 { font-size: 22px; font-weight: 700; letter-spacing: -.2px; }
    label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin: 14px 0 6px; }
    input { width: 100%; background: var(--bg-secondary); color: var(--text); border: 1px solid var(--border); border-radius: var(--r-md); padding: 12px 13px; font-size: 14px; font-family: inherit; outline: none; }
    input::placeholder { color: var(--dim); }
    input:focus-visible { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(var(--accent-rgb), .25); }
    input:disabled { opacity: .6; }
    .pw { position: relative; }
    .pw input { padding-right: 46px; }
    .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: 0; color: var(--muted); width: 34px; height: 34px; display: grid; place-items: center; cursor: pointer; border-radius: 6px; }
    .pw button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
    .pw button .off { display: none; }
    .pw button[aria-pressed="true"] .on { display: none; }
    .pw button[aria-pressed="true"] .off { display: block; }
    .pw button:hover { color: var(--text); background: var(--bg-tertiary); }
    .msg { min-height: 20px; margin-top: 12px; font-size: 13px; line-height: 1.45; color: var(--danger); }
    .btn { width: 100%; margin-top: 6px; padding: 13px; border-radius: var(--r-md); border: 0; font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; color: #fff; background: var(--gradient); box-shadow: 0 2px 8px rgba(var(--accent-rgb), .3); }
    .btn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(var(--accent-rgb), .4); }
    .btn:active:not(:disabled) { transform: translateY(0); box-shadow: 0 2px 8px rgba(var(--accent-rgb), .3); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn:focus-visible, .link:focus-visible, .pw button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .link { background: none; border: 0; color: var(--muted); font-size: 13px; font-family: inherit; cursor: pointer; margin: 12px auto 0; display: block; padding: 6px 10px; border-radius: 6px; }
    .link:hover { color: var(--text); }
    @media (prefers-reduced-motion: no-preference) { .btn { transition: transform .15s, box-shadow .15s, opacity .15s; } input { transition: border-color .15s, box-shadow .15s; } }
  </style>
</head>

g==" /><h1 id="ttl">Đăng nhập VidMaster</h1></div>

    <form id="f" autocomplete="off" novalidate>
      <label for="u">Tài khoản</label>
      <input id="u" name="u" type="text" autocomplete="username" spellcheck="false" autofocus />
      <label for="p">Mật khẩu</label>
      <div class="pw">
        <input id="p" name="p" type="password" autocomplete="current-password" />
        <button type="button" id="eye" aria-label="Hiện mật khẩu" aria-pressed="false" title="Hiện mật khẩu">
          <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 5.2A10 10 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1"/><path d="M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a10 10 0 0 0 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m3 3 18 18"/></svg>
        </button>
      </div>
      <div id="msg" class="msg" role="alert" aria-live="assertive"></div>
      <button class="btn" id="go" type="submit">Đăng nhập</button>
    </form>
    <button class="link" id="quit" type="button">Thoát ứng dụng</button>
  </main>

<script>
  const $ = (id) => document.getElementById(id);
  const f = $("f"), u = $("u"), p = $("p"), msg = $("msg"), go = $("go");
  let busy = false, lockTimer = null;

  const setMsg = (t, ok) => { msg.textContent = t || ""; msg.style.color = ok ? "var(--success)" : "var(--danger)"; };
  const setBusy = (b) => { busy = b; go.disabled = b; u.disabled = b; p.disabled = b; go.textContent = b ? "Đang đăng nhập..." : "Đăng nhập"; };

  loginApi.info().then((i) => {
    if (i.lastUser) { u.value = i.lastUser; p.focus(); }
    if (i.notice) setMsg(i.notice);
  });

  $("eye").addEventListener("click", () => {
    const show = p.type === "password";
    p.type = show ? "text" : "password";
    $("eye").setAttribute("aria-pressed", String(show));
    $("eye").setAttribute("aria-label", show ? "Ẩn mật khẩu" : "Hiện mật khẩu");
    $("eye").title = show ? "Ẩn mật khẩu" : "Hiện mật khẩu";
  });

  $("quit").addEventListener("click", () => loginApi.quit());

  function lockFor(sec) {
    clearInterval(lockTimer);
    let left = Math.max(1, sec | 0);
    const tick = () => {
      if (left <= 0) { clearInterval(lockTimer); go.disabled = false; setMsg(""); return; }
      go.disabled = true; setMsg("Đăng nhập sai quá nhiều lần. Thử lại sau " + Math.ceil(left / 60) + " phút.");
      left--;
    };
    tick(); lockTimer = setInterval(tick, 1000);
  }

  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (busy) return;
    if (!u.value.trim() || !p.value) return setMsg("Nhập tài khoản và mật khẩu.");
    setMsg(""); setBusy(true);
    let r;
    try { r = await loginApi.submit(u.value.trim(), p.value); } catch { r = { ok: false, message: "Có lỗi xảy ra, thử lại." }; }
    setBusy(false);
    if (r.ok) { setMsg("Đăng nhập thành công", true); p.value = ""; return; }
    p.value = ""; p.focus();
    if (r.kind === "rate" && r.retryAfter) lockFor(r.retryAfter); else setMsg(r.message);
  });
</script>
